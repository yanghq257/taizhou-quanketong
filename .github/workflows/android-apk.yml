name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Bundle web app into Android assets
        run: |
          mkdir -p android_app/app/src/main/assets
          rm -rf android_app/app/src/main/assets/www
          cp -R dist android_app/app/src/main/assets/www

      - name: Build installable test APK
        working-directory: android_app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p release
          cp android_app/app/build/outputs/apk/debug/app-debug.apk release/taizhou-quanketong-v0.1.0-test.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: taizhou-quanketong-android-test
          path: release/taizhou-quanketong-v0.1.0-test.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create v0.1.0 \
              --repo "$GITHUB_REPOSITORY" \
              --title "台州全科通 v0.1.0 Android 测试版" \
              --notes "Android 测试安装包（debug 签名，非应用商店正式签名）。iOS 请使用 GitHub Pages 安装 PWA。应用内容为教学演示示例，不替代医院制度、临床判断或药师审核。" \
              --latest
          gh release upload v0.1.0 release/taizhou-quanketong-v0.1.0-test.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
